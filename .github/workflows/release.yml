# Releases this repo with its own release-please workflow: merging the
# release PR it opens tags and publishes the next version.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write
